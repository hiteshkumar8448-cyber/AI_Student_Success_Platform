<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Success Platform — University Login</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🎓</div>
                <h1 class="login-title">Student Success AI</h1>
                <p class="login-subtitle">Intelligent Academic Analytics & Early-Warning Platform</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="role-tabs" role="tablist" aria-label="Login Role Selection">
                <button type="button" class="role-tab-btn active" data-role="student" id="tabStudent" role="tab" aria-selected="true" onclick="setRole('student')">
                    <span>👨‍🎓</span> Student Portal
                </button>
                <button type="button" class="role-tab-btn" data-role="faculty" id="tabFaculty" role="tab" aria-selected="false" onclick="setRole('faculty')">
                    <span>👩‍🏫</span> Faculty Portal
                </button>
            </div>

            <!-- Message Banner -->
            <div id="loginMessage" class="login-message" role="alert" aria-live="polite"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <!-- Student ID Input Group (Active for student) -->
                <div class="form-group" id="studentIdGroup">
                    <label class="form-label" for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="student_id" class="form-control" placeholder="e.g. STU1001" autocomplete="username">
                </div>

                <!-- Faculty ID Input Group (Active for faculty) -->
                <div class="form-group" id="facultyIdGroup" style="display: none;">
                    <label class="form-label" for="facultyId">Faculty ID</label>
                    <input type="text" id="facultyId" name="faculty_id" class="form-control" placeholder="e.g. FACULTY001" autocomplete="username">
                </div>

                <!-- Hidden fallback ID element to ensure compatibility -->
                <input type="hidden" id="loginId" value="">

                <!-- Password Input Group -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    <small id="passwordHint" style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">
                        Default student password is your Student ID
                    </small>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary btn-submit">
                    <span id="submitBtnText">Login as Student</span>
                </button>
            </form>

            <!-- Student Demo Credentials Box -->
            <div id="studentDemoBox" class="demo-credentials-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>Demo Student Account:</strong>
                        <div style="font-size: 0.74rem; color: var(--text-secondary); margin-top: 2px;">
                            ID: <b>STU1001</b> &nbsp;|&nbsp; Password: <b>STU1001</b>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline btn-xs" onclick="quickFill('STU1001', 'STU1001')">
                        Quick Fill
                    </button>
                </div>
            </div>

            <!-- Faculty Demo Credentials Box -->
            <div id="facultyDemoBox" class="demo-credentials-box" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>Demo Faculty Account:</strong>
                        <div style="font-size: 0.74rem; color: var(--text-secondary); margin-top: 2px;">
                            ID: <b>FACULTY001</b> &nbsp;|&nbsp; Password: <b>FACULTY001</b>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline btn-xs" onclick="quickFill('FACULTY001', 'FACULTY001')">
                        Quick Fill
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth-guard.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
